name: CI

# Runs the test profile on real reads with each software stack, on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: nextflow lint (strict syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
      - run: nextflow lint .

  test-docker:
    name: test (docker, Nextflow ${{ matrix.nextflow }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["25.04.6", "latest-stable"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}

      - name: Build the R image from this commit
        run: docker build -t auto16s-r:ci containers/r-analysis

      - name: Run the test profile
        run: nextflow run . -profile test,docker --r_container auto16s-r:ci --outdir results

      - name: Check the main outputs
        run: |
          for f in multiqc/multiqc_report.html phyloseq/phyloseq_object.rds phyloseq/asv_table.tsv \
                   primers/primers.tsv alpha_diversity/alpha_diversity.tsv beta_diversity/beta_diversity_tests.tsv \
                   maaslin3/maaslin3_all_results.csv report/auto16s_report.html; do
            test -s "results/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -qP "^status\tdetected" results/primers/primers.tsv

      - name: Report failed tasks
        if: failure()
        run: .github/scripts/report_failed_tasks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-docker-${{ matrix.nextflow }}
          path: |
            results/multiqc/multiqc_report.html
            results/pipeline_info/
            .nextflow.log

  test-conda:
    name: test (conda, no containers)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-activate: true

      - name: Run the test profile
        run: nextflow run . -profile test,conda --outdir results

      - name: Check the main outputs
        run: test -s results/multiqc/multiqc_report.html && test -s results/phyloseq/phyloseq_object.rds

      - name: Report failed tasks
        if: failure()
        run: .github/scripts/report_failed_tasks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-conda
          path: |
            results/multiqc/multiqc_report.html
            .nextflow.log
